name: checks

on:
  push:
  pull_request:

jobs:
  data:
    name: data integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas
        run: python -m pip install --upgrade pip pandas
      - name: Check the data files against each other, the page and the README
        run: python tests/check_data.py

  render:
    name: render check (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Open index.html and exercise every control
        run: python tests/render_check.py
